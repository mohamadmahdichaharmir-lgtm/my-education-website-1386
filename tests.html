<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Website</title>
    <link rel="stylesheet" href="./CSS/tests.css" />
    <link rel="icon" href="asset/icon/rocket.png" type="image/png" />
  </head>
  <body>
    <header>
      <div class="logo">
        <div class="logo-icon">
          <span></span>
        </div>
        <h2>Maxin</h2>
      </div>
      <div class="logo-center">
        <a href="https://my-education-website-1386.vercel.app/points.html">Points</a>
        <a href="https://my-education-website-1386.vercel.app/exams.html">Exams</a>
        <a href="https://my-education-website-1386.vercel.app/tests.html">Tests</a>
        <a href="https://my-education-website-1386.vercel.app/">Home</a>
      </div>
      <a href="#"><div class="icon-image"></div></a>
    </header>

    <!-- Main -->
    <main>
      <aside>
        <section class="practice-learn">
          <b class="text-icon-1">Practice & Learn</b>
          <div class="icon-practice"></div>
        </section>
        <div class="setting-center">
          <img src="Neon Clipboard and Stopwatch Icon.png" alt="" width="600" class="clock-center" />
          <div class="text-main">
            <h1>
              Tes<span class="text-t">t</span><span class="text-s">s</span>
            </h1>
            <p class="p-center">
              Choose a subject and start practicing <br> with topic-based tests
            </p>
          </div>
        </div>
      </aside>

      <aside class="aside-2">
        <div class="cards">
          <!-- Card 4 -->
           <div class="card-4">
            <div class="icon-4"></div>
            <h3>Physics</h3>
            <p class="p-card">11 Tests</p>
            <div class="mix-button">
              <div class="icon-arrow"></div>
              <h5>Start</h5>
            </div>
           </div>

          <!-- Card-3 -->
           <div class="card-3">
            <div class="icon-3"></div>
            <h3>Mathematics</h3>
            <p class="p-card">14 Tests</p>
            <div class="mix-button">
              <div class="icon-arrow"></div>
              <h5>Start</h5>
            </div>
           </div>

          <!-- Card 2 -->
          <div class="card-2">
            <div class="icon-2"></div>
            <h3>Chemistry</h3>
            <p class="p-card">10 Tests</p>
            <div class="mix-button">
              <div class="icon-arrow"></div>
              <h5>Start</h5>
            </div>
          </div>

          <!-- Card 1 -->
          <div class="card-1">
            <div class="icon-1"></div>
            <h3>Biology</h3>
            <p class="p-card">12 Tests</p>
            <div class="mix-button">
              <div class="icon-arrow"></div>
              <h5>Start</h5>
            </div>
          </div>
        </div>
      </aside>
    </main>
  </body>
</html>
